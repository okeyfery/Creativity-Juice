    <!-- Non-blocking fallback web fonts so slow/restricted networks never block page load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link

      onload="this.media='all'"

    <script>
      // Ensure restricted WebViews / Safari Private Mode / blocked storage / network rejections never crash page boot
      (function () {
        function createMemoryStorage() {
          var store = {};
          return {
            getItem: function (k) { return Object.prototype.hasOwnProperty.call(store, k) ? store[k] : null; },
            setItem: function (k, v) { store[k] = String(v); },
            removeItem: function (k) { delete store[k]; },
            clear: function () { store = {}; },
            key: function (i) { return Object.keys(store)[i] || null; },
            get length() { return Object.keys(store).length; }
          };
        }
        ['localStorage', 'sessionStorage'].forEach(function (prop) {
          try {
            var s = window[prop];
            var testKey = '__cj_storage_test__';
            s.setItem(testKey, '1');
            s.removeItem(testKey);
          } catch (e) {
            try {
              var mem = createMemoryStorage();
              Object.defineProperty(window, prop, {
                value: mem,
                configurable: true,
                writable: true
              });
            } catch (_) {}
          }
        });

        // Prevent unhandled network/font/audio promise rejections from crashing strict WebViews
        window.addEventListener('unhandledrejection', function (event) {
          if (event && event.reason) {
            var msg = String(event.reason.message || event.reason || '');
            if (
              msg.indexOf('Failed to fetch') !== -1 ||
              msg.indexOf('NetworkError') !== -1 ||
              msg.indexOf('Load failed') !== -1 ||
              msg.indexOf('The operation is insecure') !== -1 ||
              msg.indexOf('QuotaExceededError') !== -1 ||
              msg.indexOf('play()') !== -1 ||
              msg.indexOf('AudioContext') !== -1
            ) {
              event.preventDefault();
            }
          }
        });
      })();
    </script>
